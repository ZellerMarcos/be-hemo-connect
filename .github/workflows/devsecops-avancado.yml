name: DevSecOps avancado Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:0075662e5c287cf0a68caebabbfea872e5dc461912ad6d7345fa02a290d0ccb6

jobs:
  zap:
    name: ZAP DAST Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres@sha256:cbf42f0edc946c0bc1b8eeed62403734e1f25dc67a3491455d07a92fdb558b28 # 16-alpine, linux/amd64
        env:
          POSTGRES_USER: hemo_dast
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: hemo_dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hemo_dast -d hemo_dast"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: ci
      HEMO_DAST_ISOLATED: "1"
      DATABASE_URL: postgresql+psycopg://hemo_dast:isolated-ci-only@127.0.0.1:5432/hemo_dast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install application and CI dependencies
        run: python -m pip install -r requirements.txt -r requirements-devsecops.txt
      - name: Test fail-closed gates
        run: python -m unittest discover -s scripts/security_tests -v
      - name: Start isolated API and scan both roles
        shell: bash
        run: |
          set -euo pipefail
          export DAST_PRIVATE_DIR="$RUNNER_TEMP/hemo-dast-private"
          mkdir -p security-results/zap "$DAST_PRIVATE_DIR"
          chmod 700 "$DAST_PRIVATE_DIR"
          python -m uvicorn scripts.dast_app:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/dast-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -rf "$DAST_PRIVATE_DIR"' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then echo "Isolated API failed to start" >&2; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/prepare_dast.py prepare --private "$DAST_PRIVATE_DIR" --output security-results/zap
          failed=0
          for role in doador administrador; do
            set +e
            docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$DAST_PRIVATE_DIR:/zap/private:ro" \
              -v "$PWD/security-results/zap:/zap/reports:rw" \
              "$ZAP_IMAGE" zap.sh -dir /tmp/zap-ci -cmd -autorun "/zap/private/$role-plan.yaml" > "$RUNNER_TEMP/zap-$role.log" 2>&1
            status=$?
            set -e
            python scripts/prepare_dast.py sanitize --private "$DAST_PRIVATE_DIR" --output security-results/zap
            if ! python scripts/security_gate.py zap "security-results/zap/zap-$role.json" --scanner-exit "$status"; then failed=1; fi
          done
          exit "$failed"
      - name: Upload sanitized ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-backend
          path: security-results/zap/
          if-no-files-found: error
          retention-days: 14

  bearer:
    name: Bearer Privacy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install verified Bearer CLI
        run: bash scripts/install_security_tool.sh bearer "$RUNNER_TEMP/security-bin"
      - name: Scan application - Critical blocks
        run: |
          mkdir -p security-results/bearer
          "$RUNNER_TEMP/security-bin/bearer" scan app \
            --disable-default-rules --external-rule-dir "$RUNNER_TEMP/security-bin/bearer-rules/rules" \
            --disable-version-check --no-extract \
            --format json --output security-results/bearer/bearer.json \
            --fail-on-severity critical --exit-code 1
      - name: Generate data privacy inventory
        if: always()
        run: |
          mkdir -p security-results/bearer
          "$RUNNER_TEMP/security-bin/bearer" scan app \
            --disable-default-rules --external-rule-dir "$RUNNER_TEMP/security-bin/bearer-rules/rules" \
            --disable-version-check --no-extract --report privacy \
            --format json --output security-results/bearer/privacy.json
      - name: Verify report exists
        if: always()
        run: python -c "import json; from pathlib import Path; [json.loads(Path('security-results/bearer', name).read_text()) for name in ('bearer.json', 'privacy.json')]"
      - name: Upload privacy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bearer-backend
          path: security-results/bearer/
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Trivy SBOM Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve application dependencies outside scanner environment
        run: |
          python -m venv "$RUNNER_TEMP/sbom-app"
          "$RUNNER_TEMP/sbom-app/bin/python" -m pip install -r requirements.txt
          mkdir -p security-results/sbom/inventory
          "$RUNNER_TEMP/sbom-app/bin/python" -m pip freeze > security-results/sbom/inventory/requirements.txt
      - name: Install verified Trivy
        run: bash scripts/install_security_tool.sh trivy "$RUNNER_TEMP/security-bin"
      - name: Generate and validate complete CycloneDX SBOM
        run: |
          "$RUNNER_TEMP/security-bin/trivy" fs --format cyclonedx \
            --output security-results/sbom/sbom.json security-results/sbom/inventory
          python scripts/security_gate.py sbom security-results/sbom/sbom.json --expect fastapi sqlalchemy argon2-cffi
          printf '{"commit":"%s","tool":"Trivy 0.76.1","scope":"resolved application dependencies, including test dependencies"}\n' \
            "$GITHUB_SHA" > security-results/sbom/metadata.json
      - name: Upload downloadable SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend
          path: security-results/sbom/
          if-no-files-found: error
          retention-days: 14
